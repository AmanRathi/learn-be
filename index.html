<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backend Notes</title>
<meta name="description" content="Public notes on backend engineering — searchable, plain language, with examples.">
<style>
  :root{
    --bg:#fbfbf9; --panel:#ffffff; --text:#1c1c1a; --muted:#6b6b66;
    --line:#e4e4de; --accent:#b5522a; --accent-soft:#fbeee7; --on-accent:#fff;
    --mark:#ffe9a8; --code-bg:#f4f4f0; --shadow:0 1px 2px rgba(0,0,0,.05);
    --radius:10px;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131315; --panel:#1a1a1d; --text:#e8e8e4; --muted:#9a9a93;
      --line:#2c2c30; --accent:#e88a5c; --accent-soft:#2a1d16; --on-accent:#17110d;
      --mark:#5c4a10; --code-bg:#202024; --shadow:none;
    }
  }
  :root[data-theme="light"]{
    --bg:#fbfbf9; --panel:#ffffff; --text:#1c1c1a; --muted:#6b6b66;
    --line:#e4e4de; --accent:#b5522a; --accent-soft:#fbeee7; --on-accent:#fff;
    --mark:#ffe9a8; --code-bg:#f4f4f0; --shadow:0 1px 2px rgba(0,0,0,.05);
  }
  :root[data-theme="dark"]{
    --bg:#131315; --panel:#1a1a1d; --text:#e8e8e4; --muted:#9a9a93;
    --line:#2c2c30; --accent:#e88a5c; --accent-soft:#2a1d16; --on-accent:#17110d;
    --mark:#5c4a10; --code-bg:#202024; --shadow:none;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth; scroll-padding-top:110px}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:16px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .head-inner{max-width:1100px; margin:0 auto; padding:14px 20px 12px}
  .title-row{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  h1{font-size:19px; margin:0; letter-spacing:-.01em}
  h1 .dot{color:var(--accent)}
  .sub{color:var(--muted); font-size:13px; margin:0}
  .spacer{flex:1}
  .theme-btn{
    background:none; border:1px solid var(--line); color:var(--muted);
    border-radius:99px; padding:4px 11px; font-size:12px; cursor:pointer;
    font-family:inherit;
  }
  .theme-btn:hover{color:var(--text); border-color:var(--muted)}

  .search-wrap{position:relative; margin-top:11px}
  #search{
    width:100%; padding:11px 78px 11px 38px; font-size:15px; font-family:inherit;
    background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:var(--radius); outline:none;
  }
  #search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .search-icon{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:14px; pointer-events:none;
  }
  .kbd{
    position:absolute; right:11px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:11px; font-family:var(--mono);
    border:1px solid var(--line); border-radius:5px; padding:1px 6px;
    pointer-events:none;
  }
  #search:not(:placeholder-shown) ~ .kbd{display:none}

  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:11px}
  .chip{
    font-size:12.5px; font-family:inherit; cursor:pointer;
    background:var(--panel); color:var(--muted);
    border:1px solid var(--line); border-radius:99px; padding:4px 11px;
  }
  .chip:hover{color:var(--text)}
  .chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .chip .n{opacity:.65; font-family:var(--mono); font-size:11px}

  /* ---------- layout ---------- */
  main{max-width:1100px; margin:0 auto; padding:26px 20px 90px; display:flex; gap:34px}
  .notes{flex:1; min-width:0}
  aside{
    width:196px; flex:none; position:sticky; top:118px; align-self:flex-start;
    max-height:calc(100vh - 150px); overflow:auto;
  }
  aside h2{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 9px}
  aside a{display:block; padding:3px 0; font-size:13.5px; color:var(--muted); text-decoration:none}
  aside a:hover{color:var(--accent)}
  @media (max-width:860px){ aside{display:none} main{padding-top:20px} }
  /* before the first note exists, hide the empty scaffolding */
  body.no-notes aside, body.no-notes .search-wrap, body.no-notes .chips{display:none}

  /* ---------- notes ---------- */
  .cat-head{
    font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    margin:34px 0 12px; padding-bottom:7px; border-bottom:1px solid var(--line);
  }
  .cat-head:first-child{margin-top:0}

  article{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:13px; box-shadow:var(--shadow);
  }
  article h3{
    font-size:17px; margin:0 0 8px; line-height:1.4; letter-spacing:-.01em;
    display:flex; align-items:baseline; gap:8px;
  }
  .anchor{
    color:var(--muted); text-decoration:none; font-weight:400; opacity:0;
    font-family:var(--mono); font-size:13px; transition:opacity .12s;
  }
  article:hover .anchor{opacity:.55}
  .anchor:hover{opacity:1 !important; color:var(--accent)}
  .body p{margin:0 0 10px}
  .body p:last-child{margin-bottom:0}
  .body ul,.body ol{margin:0 0 10px; padding-left:22px}
  .body li{margin-bottom:4px}
  .body code, .tags code{
    font-family:var(--mono); font-size:.87em; background:var(--code-bg);
    padding:1.5px 5px; border-radius:4px;
  }
  .body strong{font-weight:650}

  .callout{
    border-left:3px solid var(--accent); background:var(--accent-soft);
    padding:10px 14px; border-radius:0 6px 6px 0; margin:12px 0 0; font-size:14.5px;
  }
  .callout b{color:var(--accent); font-size:11px; letter-spacing:.07em; text-transform:uppercase; display:block; margin-bottom:2px}

  .ex{margin-top:12px}
  .ex-label{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:5px}
  pre{
    margin:0 0 8px; background:var(--code-bg); border:1px solid var(--line);
    border-radius:7px; padding:12px 14px; overflow-x:auto;
    font-family:var(--mono); font-size:13px; line-height:1.55;
  }
  pre:last-child{margin-bottom:0}

  .tags{margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .tag{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    border:1px solid var(--line); border-radius:99px; padding:1px 8px;
    background:none; cursor:pointer;
  }
  .tag:hover{color:var(--accent); border-color:var(--accent)}

  mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}

  .empty{text-align:center; color:var(--muted); padding:70px 20px}
  .empty code{font-family:var(--mono)}
  footer{
    max-width:1100px; margin:0 auto; padding:0 20px 40px;
    color:var(--muted); font-size:12.5px; border-top:1px solid var(--line);
    padding-top:18px;
  }
</style>
</head>

<header>
  <div class="head-inner">
    <div class="title-row">
      <h1>Backend Notes<span class="dot">.</span></h1>

<footer id="footer"></footer>

<script>
/* ============================================================================
   NOTES DATA — this is the only part that changes as I learn.
   ----------------------------------------------------------------------------
   Append one object per note. Newest goes at the BOTTOM (notes render in array
   order, grouped by category). Template:

   {
     id:       "kebab-case-unique-id",     // becomes the #anchor link — never change it later
     title:    "Short title — the slightly longer, more specific part",
     category: "Databases",                // reuse an existing category name where one fits
     tags:     ["sql", "indexes"],

     highlight:`The gotcha worth remembering.`,      // optional callout — omit if there isn't one
     examples: [ { label:"SQL", code:`SELECT 1;` } ] // optional — omit if none
   }
   ========================================================================== */

const NOTES = [

{
  id: "node-project-structure",
  title: "Project structure — how a Node backend is laid out, and why it's split that way",
  category: "Project Structure",
  tags: ["nodejs", "structure", "basics"],
  body: `
    <p>A Node backend splits into two halves. <b>The root folder</b> holds files that <i>describe and configure</i> the project — dependencies, secrets, formatting rules. <b><code>src/</code></b> holds every line of code you actually write.</p>
    <p>Inside <code>src</code>, files are grouped by <b>the job they do</b>, not by feature: everything that talks to the database in one place, everything that decides what happens on a request in another. The payoff comes months later — you look for a <i>kind</i> of thing and already know which folder it's in.</p>
    <p>None of this is enforced by Node or Express. It's a convention — but a near-universal one, so following it makes your project instantly readable to any other backend dev.</p>
  `,
  highlight: `Each folder should be replaceable without touching the others. If your route file contains database queries, the structure is only decorative — the whole point is that swapping the database touches db/ and models/ and nothing else.`,
  examples: [
    { label: "The typical tree", code:
`my-app/
├── node_modules/          installed package code — auto-generated, never committed
├── public/                files served as-is (images, uploads, temp)
├── src/
│   ├── index.js           entry point: load env, connect DB, start the server
│   ├── app.js             builds the Express app: middlewares + routers
│   ├── constants.js       fixed values: DB name, enums, roles
│   ├── db/                database connection code
│   ├── models/            the shape of each collection / table
│   ├── controllers/       what actually happens for each endpoint
│   ├── routes/            URL + method  →  controller
│   ├── middlewares/       code that runs before the controller (auth, uploads)
│   └── utils/             small reusable helpers
├── .env                   real secrets — gitignored
├── .env.sample            same keys, fake values — committed
├── .gitignore
├── .prettierrc
├── eslint.config.js
├── package.json
├── package-lock.json
└── README.md` }
  ]
},

{
  id: "root-level-files",
  title: "Root-level files — everything outside src that configures the project",
  category: "Project Structure",
  tags: ["nodejs", "structure", "config", "npm"],
  body: `
    <p>None of these run your app. They tell tools — npm, git, your editor, CI — how to treat the project.</p>
    <ul>
      <li><b><code>package.json</code></b> — the project's ID card: its name, its <code>scripts</code> (<code>npm run dev</code>), and the list of dependencies. The one file here you hand-edit regularly.</li>
      <li><b><code>package-lock.json</code></b> — the exact resolved version of every package <i>and</i> every package's packages. Auto-generated. <b>Commit it</b> — it's what makes an install on another machine identical to yours.</li>
      <li><b><code>node_modules/</code></b> — the actual downloaded code of those packages. Huge, auto-generated, never committed; <code>npm install</code> rebuilds it from the two files above.</li>
      <li><b><code>.env</code></b> — real config and secrets for <i>this</i> machine: database URL, JWT secret, port, API keys. Never committed.</li>
      <li><b><code>.env.sample</code></b> — the same keys with fake values, committed, so the next person (or future you) knows exactly what needs filling in.</li>
      <li><b><code>.gitignore</code></b> — the list of things git must ignore: <code>node_modules</code>, <code>.env</code>, logs, build output.</li>
      <li><b><code>README.md</code></b> — what this project is and how to run it. The first thing anyone opens.</li>
      <li><b>ESLint config</b> (<code>eslint.config.js</code>) — rules that catch real mistakes as you type: unused variables, forgotten <code>await</code>, undefined names.</li>
      <li><b>Prettier config</b> (<code>.prettierrc</code>, <code>.prettierignore</code>) — pure formatting: quotes, semicolons, line width. It ends style arguments by making them automatic.</li>
    </ul>
    <p>Common extras as a project grows: <code>nodemon.json</code> (restart the server on save), <code>Dockerfile</code> / <code>docker-compose.yml</code>, <code>.github/workflows/</code> for CI, and <code>tsconfig.json</code> on a TypeScript project.</p>
  `,
  highlight: `Put node_modules and .env into .gitignore before your first commit. A secret that ever reached git history stays in it — deleting the line later does not remove it, you have to rotate the key.`,
  examples: [
    { label: ".gitignore", code:
`node_modules
.env
dist
*.log` },
    { label: "package.json (the parts that matter early)", code:
`{
  "name": "my-app",
  "type": "module",                      // lets you use import instead of require
  "scripts": {
    "dev": "nodemon src/index.js",
    "start": "node src/index.js"
  },
  "dependencies": {                      // needed to run in production
    "express": "^4.19.2",
    "mongoose": "^8.4.0"
  },
  "devDependencies": {                   // only needed while developing
    "nodemon": "^3.1.0",
    "prettier": "^3.3.0"
  }
}` }
  ]
},

{
  id: "src-entry-files",
  title: "index.js, app.js and constants.js — the three loose files at the top of src",
  category: "Project Structure",
  tags: ["nodejs", "express", "structure"],
  body: `
    <p>Everything else in <code>src</code> is a folder. These three files sit loose at the top because each one is a single, one-off job.</p>
    <ul>
      <li><b><code>index.js</code> — the entry point.</b> It loads the <code>.env</code> file, connects to the database, and only then starts the server listening. This is the file <code>npm run dev</code> points at.</li>
      <li><b><code>app.js</code> — builds the Express app.</b> It creates <code>app</code>, applies the configuration middlewares every request passes through, and mounts the routers. It <b>exports</b> the app; it never starts it.</li>
      <li><b><code>constants.js</code> — values that must never be typed twice.</b> The database name, enums like user roles or order statuses, fixed limits. Not secrets (those live in <code>.env</code>) — just fixed facts.</li>
    </ul>
    <p>The middlewares in <code>app.js</code> are the ones that make request data usable before any of your code sees it: <code>express.json()</code> turns a JSON request body into <code>req.body</code>, <code>express.urlencoded()</code> does the same for HTML form submissions, <code>cookieParser()</code> turns the cookie header into <code>req.cookies</code>, <code>cors()</code> decides which other origins may call this API, and <code>express.static()</code> serves a folder of files as-is.</p>
  `,
  highlight: `app.js builds the app but never calls listen() — index.js does. Keeping them apart means the DB must connect before a single request is accepted, and tests can import the app without opening a port.`,
  examples: [
    { label: "src/index.js", code:
`import dotenv from "dotenv";
import connectDB from "./db/index.js";
import app from "./app.js";

dotenv.config({ path: "./.env" });      // must run before anything reads process.env

connectDB()
  .then(() => {
    const port = process.env.PORT || 8000;
    app.listen(port, () => console.log("server listening on port " + port));
  })
  .catch((err) => {
    console.log("DB connection failed", err);
    process.exit(1);                    // no DB = no point staying up
  });` },
    { label: "src/app.js", code:
`import express from "express";
import cors from "cors";
import cookieParser from "cookie-parser";

const app = express();

app.use(cors({ origin: process.env.CORS_ORIGIN, credentials: true }));
app.use(express.json({ limit: "16kb" }));         // JSON body   -> req.body
app.use(express.urlencoded({ extended: true }));  // form body   -> req.body
app.use(cookieParser());                          // cookies     -> req.cookies
app.use(express.static("public"));                // serve /public as-is

import userRouter from "./routes/user.routes.js";
app.use("/api/v1/users", userRouter);             // mount the router

export default app;                               // no listen() here` },
    { label: "src/constants.js", code:
`export const DB_NAME = "videotube";
export const USER_ROLES = { ADMIN: "admin", USER: "user" };
export const MAX_UPLOAD_MB = 16;` }
  ]
},

{
  id: "src-folders",
  title: "The folders inside src — db, models, controllers, routes, middlewares, utils",
  category: "Project Structure",
  tags: ["nodejs", "express", "structure", "mvc"],
  body: `
    <p>Each folder holds one layer of the journey a request takes. Files are named after the thing plus the layer: <code>user.model.js</code>, <code>user.controller.js</code>, <code>user.routes.js</code>.</p>
    <ul>
      <li><b><code>db/</code></b> — the connection code, usually a single <code>connectDB()</code> function that dials the database using the URL from <code>.env</code> and the name from <code>constants.js</code>. All database-vendor-specific setup stays here.</li>
      <li><b><code>models/</code></b> — the shape of your data. One file per collection/table: its fields and types, validation rules, indexes, and hooks (like hashing a password before saving).</li>
      <li><b><code>controllers/</code></b> — the actual work of each endpoint: read the request, check the input, call the model, send a response. This is where your business logic lives.</li>
      <li><b><code>routes/</code></b> — the map. Which URL and method go to which controller, and which middlewares run first. A route file should contain no logic at all — just wiring.</li>
      <li><b><code>middlewares/</code></b> — functions that run between the request and the controller: verifying a JWT and attaching <code>req.user</code>, handling file uploads, rate limiting, and the central error handler.</li>
      <li><b><code>utils/</code></b> — small reusable helpers that know nothing about routes or requests: an <code>ApiError</code> class, a standard <code>ApiResponse</code> shape, an <code>asyncHandler</code> wrapper, file-upload or email helpers.</li>
    </ul>
    <p><b>"More, depends on the project"</b> usually means: <code>services/</code> (logic too big for a controller, or shared by several), <code>validators/</code> (input schemas), <code>config/</code>, <code>jobs/</code> or <code>workers/</code> (background tasks), <code>tests/</code>, and <code>types/</code> on TypeScript projects.</p>
  `,
  highlight: `Routes and controllers are the two that rot first. An if-statement inside a route file, or a 200-line controller doing validation + database + email, is the signal to move that work into middlewares/, utils/, or a new services/ folder.`,
  examples: [
    { label: "One request, folder by folder", code:
`GET /api/v1/users/me

app.js         prefix /api/v1/users matches   ->  routes/user.routes.js
routes         path /me matches, verifyJWT    ->  middlewares/auth.middleware.js
middleware     token ok, sets req.user        ->  next()
controller     getCurrentUser(req, res)       ->  controllers/user.controller.js
model          User.findById(req.user._id)    ->  models/user.model.js
db             uses the connection from       ->  db/index.js
response       res.json(new ApiResponse(200, user))` },
    { label: "routes/user.routes.js — wiring only", code:
`import { Router } from "express";
import { registerUser, getCurrentUser } from "../controllers/user.controller.js";
import { verifyJWT } from "../middlewares/auth.middleware.js";

const router = Router();

router.route("/register").post(registerUser);              // public
router.route("/me").get(verifyJWT, getCurrentUser);        // logged in only

export default router;` }
  ]
},

{
  id: "dotenv",
  title: "dotenv — how the secrets in your .env file end up inside process.env",
  category: "Project Structure",
  tags: ["nodejs", "structure", "config", "env"],
  body: `
    <p>Node gives every running program an object called <code>process.env</code> holding the environment variables it was started with. <code>dotenv</code> is a small package that reads a <code>.env</code> file from disk and copies its key/value pairs into that object. That is the whole job — it is a loader, nothing more.</p>
    <p><b>Why it exists.</b> Some settings change per machine: the database URL, the port, an API key, a password. They can't be hardcoded in your source, because source gets committed to git and shared with everyone. <code>process.env</code> is the right place for them, but typing out a dozen variables by hand every time you start the server is painful — so you put them in a file that git ignores, and dotenv loads it for you.</p>
    <ul>
      <li><b>Load order matters.</b> <code>config()</code> has to run before any module that reads <code>process.env</code> while being imported. That's why you see it on the first line of <code>index.js</code>, or passed as <code>node -r dotenv/config src/index.js</code>.</li>
      <li><b>Everything comes out a string.</b> <code>process.env.PORT</code> is <code>"4000"</code>, not <code>4000</code>. A variable set to <code>false</code> is the string <code>"false"</code>, which is truthy. Convert it yourself.</li>
      <li><b>It won't overwrite what's already set.</b> If <code>PORT</code> exists in the real environment, dotenv leaves it alone. That's deliberate: production sets real environment variables, and a stray <code>.env</code> shouldn't clobber them.</li>
      <li><b><code>.env</code> goes in <code>.gitignore</code>.</b> Commit a <code>.env.example</code> with the same keys but fake values, so whoever clones the repo knows what to fill in.</li>
      <li><b>It's a development convenience, not a production mechanism.</b> On a real server the variables come from the platform — Docker, systemd, Railway, ECS — and dotenv often isn't installed at all.</li>
    </ul>
    <p><b>It looks in the current working directory</b> — whatever <code>pwd</code> prints — for a file named <code>.env</code>. Not next to the file that called <code>config()</code>, and it doesn't search upward. So running from the project root finds it and running from inside <code>src/</code> doesn't. npm scripts always run from the directory holding <code>package.json</code>, which is why <code>npm run dev</code> works no matter where you are, and running the file by hand sometimes doesn't.</p>
    <p>Node 20.6 and later can do this without the package, via <code>node --env-file=.env src/index.js</code>. dotenv is still the common convention, so most courses and codebases use it.</p>
  `,
  highlight: `Every value out of process.env is a string. process.env.PORT + 1 gives you "40001", and a flag set to false is the truthy string "false".`,
  examples: [
    { label: ".env — never committed", code:
`PORT=4000
MONGODB_URI=mongodb://127.0.0.1:27017
ACCESS_TOKEN_SECRET=dev-only-not-the-real-one
CORS_ORIGIN=http://localhost:5173`},
    { label: "src/index.js — loaded first, before anything reads it", code:
`import dotenv from "dotenv";
dotenv.config({ path: "./.env" });        // must come before the imports that use it

import connectDB from "./db/index.js";
import app from "./app.js";

connectDB().then(() => {
  const port = Number(process.env.PORT) || 8000;   // string -> number, on purpose
  app.listen(port, () => console.log("listening on " + port));
});`},
    { label: "Bad vs good", code:
`BAD   — the real username and password sit in the source, and in git history forever
        mongoose.connect("mongodb+srv://<user>:<password>@<cluster>.mongodb.net")

GOOD  — the value lives in .env, the code only names it
        mongoose.connect(process.env.MONGODB_URI)`},
    { label: "Where it looks, and the silent failure", code:
`bookmarks-be/          <- .env lives here
  package.json
  src/index.js         <- the require lives here

cd bookmarks-be && npm run dev        cwd = bookmarks-be  -> finds .env
cd bookmarks-be/src && node index.js  cwd = src           -> looks for src/.env

Nothing throws when there is no .env. dotenv loads nothing, the
variable is undefined, and you get a confusing connection error
instead of "your config is missing".

To be explicit and not care about the cwd at all:

  require("dotenv").config({
    path: require("path").resolve(__dirname, "../.env")
  });

  __dirname is the folder of the current file.`}
  ]
},

{
  id: "cors-and-vite-proxy",
  title: "CORS and the Vite proxy — why localhost:5173 can't call localhost:8000, and the other ways around it",
  category: "HTTP & APIs",
  tags: ["cors", "vite", "express", "frontend"],
  body: `
    <p>Run the frontend on one port and the backend on another and the first <code>fetch</code> between them fails with a CORS error. Nothing is broken — the browser is doing its job.</p>
    <p><b>The rule.</b> An <i>origin</i> is the combination of scheme + host + port. <code>http://localhost:5173</code> and <code>http://localhost:8000</code> differ in the port, so they are two different origins. By default a browser will not let a page read a response from a different origin than the page itself. That's the same-origin policy, and it exists so a random tab you have open can't quietly call your bank's API using your logged-in cookies.</p>
    <p><b>CORS is the exception mechanism.</b> Cross-Origin Resource Sharing is the backend's way of saying "this particular origin is allowed to read my responses", which it does by sending an <code>Access-Control-Allow-Origin</code> header. No header, no read. Note the block happens <i>in the browser</i> — the request usually reached your server and ran; the browser just refuses to hand the result to your JavaScript. That's why the same call works fine in Postman or curl, which have no same-origin policy at all.</p>
    <p><b>The Vite proxy — what I set up.</b> Instead of asking the backend for permission, you remove the cross-origin call entirely. You tell the Vite dev server: any request starting with <code>/api</code>, forward it to the backend. Your page then only ever talks to <code>localhost:5173</code>, its own origin, so the policy never applies. Vite forwards the request server-to-server, where CORS isn't a thing.</p>
    <p><b>The other ways round it.</b></p>
    <ul>
      <li><b>Whitelist the origin on the backend</b> — the <code>cors</code> middleware in Express, given the exact frontend origin to trust. This is the real fix, and the one you need in production where there's no Vite dev server.</li>
      <li><b>Allow everything with <code>*</code></b> — quick, and fine for a genuinely public read-only API. Don't reach for it as a way to make an error go away, and note it flatly cannot be combined with cookies.</li>
      <li><b>Make them the same origin</b> — serve the built frontend from the backend itself, or put both behind one domain with a reverse proxy like nginx (<code>/api</code> to the backend, everything else to the frontend). Same origin, so there's nothing to allow.</li>
    </ul>
  `,
  highlight: `The Vite proxy only exists while the dev server is running. It makes the error disappear on your machine and does nothing in production — that deployment still needs a whitelisted origin or a same-origin setup. Also: origin "*" and credentials: true cannot be used together, the browser rejects the combination.`,
  examples: [
    { label: "Why the browser refuses", code:
`page origin      http://localhost:5173
request to       http://localhost:8000/api/v1/users/me
                 scheme same, host same, port differs -> different origin

response comes back 200, but with no Access-Control-Allow-Origin header
browser discards it and logs:
  Access to fetch at 'http://localhost:8000/api/v1/users/me' from origin
  'http://localhost:5173' has been blocked by CORS policy

curl http://localhost:8000/api/v1/users/me    ->  works, no policy involved`},
    { label: "vite.config.js — the proxy", code:
`import { defineConfig } from "vite";
import react from "@vitejs/plugin-react";

export default defineConfig({
  plugins: [react()],
  server: {
    proxy: {
      "/api": {
        target: "http://localhost:8000",   // where the backend actually lives
        changeOrigin: true                 // rewrite the Host header to the target
      }
    }
  }
});

// in the frontend, call the relative path — never the full backend URL
fetch("/api/v1/users/me")`},
    { label: "app.js — whitelisting instead", code:
`import express from "express";
import cors from "cors";

const app = express();

app.use(cors({
  origin: process.env.CORS_ORIGIN,   // "http://localhost:5173" in dev, the real domain in prod
  credentials: true                  // required if the frontend sends cookies
}));

export default app;`}
  ]
},

{
  id: "databases-orm-odm",
  title: "Databases, ORMs and ODMs — the layer that sits between your Node code and where the data actually lives",
  category: "Databases",
  tags: ["mongodb", "sql", "mongoose", "orm"],
  body: `
    <p>The databases you'll meet first split into two families, and the difference is simply <b>who decides the shape of your data</b>.</p>
    <p><b>SQL / relational — MySQL, Postgres, SQLite.</b> Data lives in <i>tables</i> with fixed <i>columns</i>. You declare the shape up front — <code>users</code> has an <code>id</code>, an <code>email</code> that must be a unique string, a <code>created_at</code> — and the database itself enforces it. Insert a row with a missing column or a wrong type and it is rejected. Tables point at each other with foreign keys, and you recombine them when querying using <code>JOIN</code>.</p>
    <ul>
      <li><b>Postgres</b> — the default serious choice today: strictest, most features, and can store JSON documents too when you want them.</li>
      <li><b>MySQL</b> — equally common and older, with an enormous amount of existing code and cheap hosting built around it.</li>
      <li><b>SQLite</b> — the odd one out. No server process at all: the entire database is one file on disk. Same SQL language, so it's ideal for local development, tests, and small tools.</li>
    </ul>
    <p><b>NoSQL / document — MongoDB.</b> Data lives in <i>collections</i> of <i>documents</i>, and a document is basically JSON: nested objects, arrays, any shape you like. Nothing is declared up front and nothing is enforced — two documents in the same collection can have entirely different fields and Mongo won't object. That flexibility is both the selling point and the trap.</p>
    <p><b>Why you don't talk to the database directly.</b> Every database ships a <i>driver</i>, a low-level package that opens a connection and sends raw queries. You can build on it, but it gives you nothing: no validation, no help with relations, no protection from a typo, and queries assembled by gluing strings together — which is how SQL injection happens. So you put a library in between.</p>
    <p><b>That library is an ORM or an ODM.</b> They do the same job — map what's stored into ordinary JavaScript objects so you write JS instead of query syntax — and differ only in what sits underneath:</p>
    <ul>
      <li><b>ORM</b>, Object–<b>Relational</b> Mapper, for SQL databases. "Relational" means tables, so its work is turning rows into objects and object relationships into <code>JOIN</code>s. Prisma, Drizzle, Sequelize, TypeORM.</li>
      <li><b>ODM</b>, Object–<b>Document</b> Mapper, for document databases. "Document" means JSON-ish, and those shapes already match JavaScript closely, so an ODM is a thinner layer than an ORM. <b>Mongoose</b> is the one for MongoDB.</li>
    </ul>
    <p>Both give you type casting, defaults, hooks (hash the password before every save), references you can populate, and safely built queries. But the headline for Mongo is bigger than convenience: <b>MongoDB has no schema, and Mongoose gives you one anyway</b> — declared in your model file and enforced in your application.</p>
  `,
  highlight: `A Mongoose schema is enforced by your Node process, not by the database. Anything writing through a different app, a script, or the Mongo shell bypasses every rule you declared, and documents saved before you added a field keep their old shape forever. A SQL database enforces its schema itself, so it has no equivalent hole.`,
  examples: [
    { label: "The same user, two families", code:
`SQL — a row in a table with declared columns
  id | username | email       | age
   1 | aman     | a@b.com     | 24
  the database rejects a row missing username, or with age = "old"

MongoDB — a document in a collection
  { _id: ObjectId("..."), username: "aman", email: "a@b.com", age: 24 }
  and the very next document is allowed to be
  { _id: ObjectId("..."), name: "aman", tags: ["a"], age: "old" }`},
    { label: "Raw driver vs the ODM", code:
`DRIVER — plain data back, nothing checked, nothing helped
  const user = await db.collection("users").findOne({ email: "a@b.com" });
  user.emial;                      // undefined, no error, the typo just ships

MONGOOSE — a model that knows the shape
  const user = await User.findOne({ email: "a@b.com" });
  await User.create({ email: "a@b.com" });
  // throws ValidationError: username is required`},
    { label: "models/user.model.js — the schema Mongo doesn't have", code:
`import mongoose from "mongoose";

const userSchema = new mongoose.Schema({
  username: { type: String, required: true, unique: true, lowercase: true, trim: true },
  email:    { type: String, required: true, unique: true },
  password: { type: String, required: true },
  age:      { type: Number, min: 13 }
}, { timestamps: true });          // adds createdAt and updatedAt for you

export const User = mongoose.model("User", userSchema);`}
  ]
},

{
  id: "mongoose-schema-syntax",
  title: "mongoose.Schema syntax — the two arguments it takes, and the typos in it that fail silently",
  category: "Databases",
  tags: ["mongodb", "mongoose", "schema"],
  body: `
    <p>A model file is really just three statements: build a schema, hand it to <code>mongoose.model()</code>, export the result.</p>
    <p><b><code>new mongoose.Schema(definition, options)</code> takes two objects</b>, and mixing them up is the usual source of confusion.</p>
    <ul>
      <li>The <b>first</b> describes your fields — one key per field.</li>
      <li>The <b>second</b> is settings for the schema as a whole, not for any one field. <code>timestamps: true</code> lives here.</li>
    </ul>
    <p><b>Inside a field</b>, <code>type</code> is the JavaScript constructor itself — <code>String</code>, <code>Number</code>, <code>Boolean</code>, <code>Date</code> — not the word in quotes. Everything alongside it is a rule: <code>required: true</code> refuses to save the document without it, and the others (<code>unique</code>, <code>lowercase</code>, <code>trim</code>, <code>min</code>) shape or check the value. A field needing no rules can skip the object entirely and be written as just <code>email: String</code>.</p>
    <p><b><code>timestamps: true</code></b> tells Mongoose to add and maintain two <code>Date</code> fields for you: <code>createdAt</code>, set once when the document is first saved, and <code>updatedAt</code>, rewritten on every save after that. You never set them yourself.</p>
    <p><b><code>mongoose.model("User", userSchema)</code></b> compiles the schema into the thing you actually query — <code>User.create()</code>, <code>User.findOne()</code>. The string is the model name, and Mongoose derives the real collection name from it by lowercasing and pluralising: <code>"User"</code> becomes a collection called <code>users</code>. That's why the name in your code and the name you see in Compass never quite match.</p>
  `,
  highlight: `Both of the easy mistakes here fail silently — no crash, no warning, and a schema that simply doesn't enforce what you think it does. required: String is a function, so Mongoose reads it as a conditional rule instead of a boolean and the field ends up optional. timestamp: true is not a real option, so it is ignored and you get no createdAt or updatedAt. Only required: true and timestamps: true work.`,
  examples: [
    { label: "models/user.model.js — the shape of the file", code:
`import mongoose from "mongoose";

const userSchema = new mongoose.Schema(
  {                                  // 1st argument: the fields
    email: {
      type: String,                  // the constructor, not "String"
      required: true                 // won't save without it
    }
  },
  { timestamps: true }               // 2nd argument: schema-wide options
);                                   // -> adds createdAt and updatedAt

export const User = mongoose.model("User", userSchema);`},
    { label: "The two silent typos", code:
`required: String     WRONG.  String is a function. Mongoose accepts a function
                             there for conditional rules, calls it, gets ""
                             back — falsy — so the field is NOT required.
required: true       RIGHT.

timestamp: true      WRONG.  Not an option Mongoose knows. Unknown options are
                             ignored, so no createdAt or updatedAt appear.
timestamps: true     RIGHT.  Plural.

Neither typo throws. The file loads, the server starts, and you find out
later when a document saves with no email and no dates on it.`},
    { label: "Model name vs collection name", code:
`mongoose.model("User", userSchema)

  in code        User.findOne({ email: "a@b.com" })
  in MongoDB     db.users.findOne({ email: "a@b.com" })

Mongoose lowercases and pluralises: "User" -> users, "Video" -> videos,
"Category" -> categories.`}
  ]
},

{
  id: "objectid-ref",
  title: "ObjectId and ref — MongoDB's version of a foreign key, without the enforcement",
  category: "Databases",
  tags: ["mongodb", "mongoose", "schema", "relations"],
  body: `
    <p>When one document belongs to another, you don't copy the whole thing in — you store its <code>_id</code> and point at it. Two parts do that:</p>
    <ul>
      <li><b><code>type: mongoose.Schema.Types.ObjectId</code></b> — the field holds an id, the 12-byte value MongoDB puts on every document as <code>_id</code>. Not a string, its own type.</li>
      <li><b><code>ref: "Category"</code></b> — <i>which</i> collection that id belongs to. The string has to match the model name you registered with <code>mongoose.model("Category", ...)</code> exactly, because that's how Mongoose looks it up later.</li>
    </ul>
    <p>On its own this stores nothing but an id. To get the real document you ask for it with <b><code>.populate()</code></b>, which swaps the id in the result for the whole document it points at. Worth knowing what that costs: it is not a <code>JOIN</code>. Mongoose runs a <i>second query</i> against the other collection and stitches the results together in Node. The database isn't doing the work — your app is.</p>
    <p><b>How this is like a foreign key:</b> same idea, same purpose — one record pointing at another instead of duplicating it, so updating the category updates it everywhere at once.</p>
    <p><b>How it isn't:</b> a SQL foreign key is a <i>constraint the database enforces</i>. It refuses to insert a row pointing at an id that doesn't exist, and refuses to delete a row that others still point at (or cascades, if you asked it to). MongoDB does none of that. <code>ref</code> is a note to Mongoose about where to look during <code>populate()</code> — nothing more. Nothing checks the id is real, and nothing stops you deleting the thing being pointed at.</p>
  `,
  highlight: `Nothing enforces the reference. You can save a category id that never existed, and deleting a Category leaves every document pointing at it holding a dead id — no error, no cascade. Those documents populate as null, which is where the crash finally shows up, far from the delete that caused it. Cleaning up after a delete is your code's job, not the database's.`,
  examples: [
    { label: "The two models", code:
`// models/category.model.js
const categorySchema = new mongoose.Schema({ name: { type: String, required: true } });
export const Category = mongoose.model("Category", categorySchema);

// models/product.model.js
const productSchema = new mongoose.Schema({
  title:    { type: String, required: true },
  category: {
    type: mongoose.Schema.Types.ObjectId,
    ref: "Category"                          // matches the name above, exactly
  },
  tags: [{ type: mongoose.Schema.Types.ObjectId, ref: "Tag" }]   // many, in an array
}, { timestamps: true });`},
    { label: "What is stored vs what you get back", code:
`stored in MongoDB — just an id
  { _id: ObjectId("a1..."), title: "Keyboard", category: ObjectId("b2...") }

await Product.findById(id)
  { _id: ..., title: "Keyboard", category: ObjectId("b2...") }
  product.category.name   ->  undefined

await Product.findById(id).populate("category")
  { _id: ..., title: "Keyboard", category: { _id: ObjectId("b2..."), name: "Input" } }
  product.category.name   ->  "Input"

populate("category") runs a second query on the categories collection.`},
    { label: "SQL would stop you — Mongo won't", code:
`SQL
  DELETE FROM categories WHERE id = 5;
  ERROR: update or delete violates foreign key constraint on table "products"

MongoDB
  await Category.findByIdAndDelete(id);       // succeeds, no complaint

  every product still holds that id, and now
  await Product.findById(p).populate("category")
  -> category: null`}
  ]
},

{
  id: "postgres-is-a-server",
  title: "Postgres is a server, not a library — your app can crash and the data stays",
  category: "Databases",
  tags: ["postgres", "sql"],
  body: `
    <p>This is the idea everything else rests on. Postgres is a <b>separate program running in the background</b>, listening on port 5432, holding your data in files on disk. It has nothing to do with your Node process and doesn't care whether it's running.</p>
    <ul>
      <li>Your app can crash — the data is untouched.</li>
      <li>You can insert rows with <code>psql</code> while the app is stopped, and the app sees them when it starts again.</li>
      <li>Your API, <code>psql</code>, and a GUI tool are three separate clients all talking to the same server, all seeing the same data.</li>
    </ul>
    <p>That's why <code>npm install pg</code> doesn't get you a database — it gets you a client that dials one. Which also means <b>most beginner connection errors are just "the server isn't running"</b>.</p>
    <p><b>One server, many databases.</b> You don't want a separate Postgres install per project. Homebrew installs globally (the directory you run <code>brew</code> from is irrelevant — unlike npm, there's no project-local option), and isolation happens one level down: one server, with a database inside it per project. Same shape as installing Node once and having per-project <code>node_modules</code>.</p>
  `,
  highlight: `Stop your Node server, insert a row by hand in psql, restart, and GET the list — the row is there. Your app didn't create that data and wasn't even running when it appeared. If one thing from the whole exercise is worth internalising, it's that.`,
  examples: [
    { label: "One server, a database per project", code:
`Postgres server (one, global, port 5432)
├── postgres          <- default, ships with the install
├── bookmarks_dev     <- this project
└── some_other_app    <- next project

server is global, data is per-project`},
    { label: "Running it (Homebrew, macOS)", code:
`brew install postgresql@17

brew services start postgresql@17    # start now, and on every login
brew services stop postgresql@17
brew services list                   # want to see: started

createdb bookmarks_dev               # a database for this project
dropdb   bookmarks_dev`},
    { label: "The error that means nothing is listening", code:
`psql: error: connection to server on socket "/tmp/.s.PGSQL.5432"
failed: No such file or directory

When Postgres starts it creates that socket file for local clients.
No file means no server process ever created one. So this is not a
permissions problem or a wrong database name — nothing is running.

  brew services start postgresql@17
  brew services list

If it says "error", read the log:
  tail -50 /opt/homebrew/var/log/postgresql@17.log

If it says started but psql still fails, the data directory was never
initialised (a once-ever command):
  ls     /opt/homebrew/var/postgresql@17     # empty or missing?
  initdb /opt/homebrew/var/postgresql@17
  brew services restart postgresql@17`}
  ]
},

{
  id: "psql-the-client",
  title: "psql — the terminal client, and knowing which prompt you're typing into",
  category: "Databases",
  tags: ["postgres", "psql", "sql"],
  body: `
    <p><code>psql</code> is just a program that connects to the Postgres server and sends it SQL. It has no special status: you are one client, your Node app is another, and both see the same data.</p>
    <p><b>Know where you are.</b> Most early confusion is typing the right thing at the wrong prompt.</p>
    <ul>
      <li><code>user@Machine dir %</code> — the <b>normal terminal</b>. <code>brew</code>, <code>npm</code>, <code>psql</code>, <code>git</code> go here.</li>
      <li><code>bookmarks_dev=#</code> — <b>inside psql</b>. SQL goes here, plus psql's own commands like <code>\\dt</code>.</li>
      <li>No prompt at all — a <b>file</b> in your editor.</li>
    </ul>
    <p>The trap: <code>psql bookmarks_dev -f schema.sql</code> is a <i>normal terminal</i> command even though it runs SQL. It launches psql, feeds it the file, and exits — you never see the <code>=#</code> prompt. Rule of thumb: anything starting with the word <code>psql</code> is typed in the normal terminal.</p>
    <p><b>Backslash commands are psql's, not SQL's</b>, and take no semicolon. Actual SQL statements do need one — if your prompt changes from <code>bookmarks_dev=#</code> to <code>bookmarks_dev-#</code> and nothing happened, psql is still waiting for it. Type <code>;</code> and hit enter.</p>
    <p>TablePlus and pgAdmin do the same job visually — point either at <code>localhost:5432</code>. Worth switching once typing SQL by hand feels comfortable.</p>
  `,
  highlight: `Homebrew's versioned formulae are "keg-only", meaning psql is not put on your PATH automatically. If psql --version says command not found after a successful install, it installed fine — your shell just can't see it.`,
  examples: [

`# Apple Silicon
echo 'export PATH="/opt/homebrew/opt/postgresql@17/bin:$PATH"' >> ~/.zshrc
source ~/.zshrc

# Intel Macs: /usr/local instead of /opt/homebrew

psql --version      # verify`},
    { label: "Ways to invoke it", code:
`psql bookmarks_dev                  # interactive session, \\q to leave
psql bookmarks_dev -f schema.sql    # run a file, then exit
psql bookmarks_dev -c "SELECT 1"    # run one command, then exit
psql -l                             # list databases, then exit`},
    { label: "Backslash commands (no semicolon)", code:
`\\l              list databases
\\c dbname       switch database
\\dt             list tables in the current database
\\d bookmarks    describe one table: columns, types, indexes
\\q              quit

SELECT * FROM bookmarks;      <- real SQL, semicolon required`}
  ]

{
  id: "creating-tables",
  title: "CREATE TABLE — what SERIAL, NOT NULL and TIMESTAMPTZ are each buying you",
  category: "Databases",
  tags: ["postgres", "sql", "schema"],
  body: `
    <p>Unlike a Mongo collection, which springs into existence the first time you insert, a table <b>must exist before you can write a single row</b>. You declare its columns and their types up front, and the database holds you to it from then on.</p>
    <p>Reading the bookmarks table one line at a time:</p>
    <ul>
      <li><b><code>SERIAL PRIMARY KEY</code></b> — <code>SERIAL</code> is an auto-incrementing integer: Postgres keeps a hidden counter (a <i>sequence</i>) and pulls the next value on each insert, so your <code>INSERT</code> never mentions <code>id</code>. <code>PRIMARY KEY</code> means unique and not null, and creates an index for free.</li>
      <li><b><code>TEXT NOT NULL</code></b> — in Postgres <code>TEXT</code> has no length limit and no performance cost versus <code>VARCHAR(n)</code>; reach for <code>VARCHAR</code> only when you actually want a maximum enforced. <code>NOT NULL</code> is the database refusing the row, not your code checking it.</li>
      <li><b><code>TIMESTAMPTZ NOT NULL DEFAULT NOW()</code></b> — timestamp <i>with time zone</i>: stores an absolute moment in UTC and converts on the way out. <code>DEFAULT NOW()</code> means the database fills it in for you.</li>
      <li><b><code>IF NOT EXISTS</code></b> — makes the file safe to run twice.</li>
    </ul>
    <p><b>Versus Mongo's <code>_id</code>:</b> ObjectIds are generated client-side and are random-ish; Postgres ids are generated server-side and sequential. Sequential ids look nicer in URLs but leak information — id 47 tells a stranger you have roughly 47 rows — and can't be known before the insert happens. Apps that care use <code>UUID</code> instead.</p>
  `,
  highlight: `Always prefer TIMESTAMPTZ over plain TIMESTAMP. TIMESTAMP stores a wall-clock reading with no zone attached, so the same value means different moments depending on where it's read — which turns into real, unfixable data corruption when a server moves region or DST arrives.`,
  examples: [
    { label: "schema.sql", code:
`CREATE TABLE IF NOT EXISTS bookmarks (
  id          SERIAL PRIMARY KEY,
  title       TEXT NOT NULL,
  url         TEXT NOT NULL,
  notes       TEXT,                                     -- optional: no NOT NULL
  created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
);`},
    { label: "Apply it and check it", code:
`createdb bookmarks_dev
psql bookmarks_dev -f schema.sql
psql bookmarks_dev -c "\\d bookmarks"`},
    { label: "Feeling NOT NULL for real", code:
`-- in psql, with no application code involved at all
INSERT INTO bookmarks (url) VALUES ('https://example.com');

ERROR:  null value in column "title" violates not-null constraint

A Mongoose required: true would not have stopped this, because psql
never loads your Node code. The rule lives in the database.`}
  ]
},

{
  id: "migrations-vs-schema-file",
  title: "Migrations vs one schema.sql — the file says what a fresh database looks like, not how to get there",
  category: "Databases",
  tags: ["postgres", "sql", "schema", "migrations"],
  body: `
    <p>Three different concerns get confused with each other:</p>
    <ul>
      <li><b>Creating the database</b> — infrastructure. Happens once, outside the app. In production your host (RDS, Neon) does it.</li>
      <li><b>Creating and altering tables</b> — an application concern, versioned in the repo, applied deliberately.</li>
      <li><b>Rows</b> — insert, select, update, delete. The app's routine job on every request.</li>
    </ul>
    <p><b>Your Express app should never run <code>CREATE TABLE</code>.</b> Run two instances and they race each other on startup, and schema changes become something you can only trigger by restarting a server. Structure is a deliberate act; moving data is routine.</p>
    <p><b>Why a single <code>schema.sql</code> stops working.</b> Once the table exists, re-running the file does nothing — <code>IF NOT EXISTS</code> makes it a no-op. So when you want to add a column, editing the file and re-running skips the whole statement and the column never appears. Dropping and recreating is fine with three test rows and unacceptable with real ones.</p>
    <p><b>Migrations</b> are an ordered sequence of files, each describing a <i>delta</i> rather than the finished state. A tool keeps a <code>schema_migrations</code> table recording which files have already run, compares it against the files on disk, and applies only the new ones, in order, inside a transaction. What that gets you: a brand-new database and a two-year-old production one end up identical; schema changes get reviewed alongside the code that needs them; deploys apply them automatically; and existing data survives, because <code>ALTER TABLE</code> modifies rather than recreates.</p>
    <p><code>node-pg-migrate</code> does this for raw <code>pg</code>; Prisma, Drizzle and TypeORM ship their own. The pattern is universal — Rails, Django and Laravel all work this way.</p>
  `,
  highlight: `If you'd rather design in a modelling tool and apply changes by hand, don't hand-maintain schema.sql — generate it with pg_dump so it's derived from the live database and can't drift. A diagram or schema file that is manually kept in sync eventually becomes confidently wrong, which is worse than not having one.`,
  examples: [
    { label: "A migrations folder", code:
`migrations/
  001_create_bookmarks.sql
  002_add_is_archived.sql
  003_create_tags.sql

002 is not a rewrite of 001. It is only the change:

  ALTER TABLE bookmarks
    ADD COLUMN is_archived BOOLEAN NOT NULL DEFAULT FALSE;`},
    { label: "Generating schema.sql instead of writing it", code:
`pg_dump --schema-only --no-owner bookmarks_dev > schema.sql`}
  ]
},

{
  id: "parameterized-queries",
  title: "$1 placeholders — why you never build a SQL string out of user input",
  category: "Databases",
  tags: ["postgres", "sql", "security"],
  body: `
    <p>Write the query with numbered placeholders and pass the values as a separate array. Never paste user input into the string.</p>
    <p><b>Why it's safe.</b> Postgres receives the query structure and the data on <b>two different channels</b>. It parses and plans the statement first, while the values are still just values — so there is no moment at which user input could be read as SQL. It isn't escaping or sanitising; the data never enters the parser at all.</p>
    <p>Glue the value into the string instead and someone passes <code>1 OR 1=1</code> and reads your entire table, or passes something worse and drops it. The parameterized version is also less code to write, so there is genuinely no reason to do it the other way.</p>
    <p>Placeholders are positional: <code>$1</code> is the first item in the array, <code>$2</code> the second.</p>
  `,
  highlight: `This is the single most important habit in the repository file. Every query, every time — including the ones where "the value is just an id and comes from our own frontend". It costs nothing and the failure mode is losing the table.`,
  examples: [
    { label: "The two forms", code:
`SAFE
  pool.query("SELECT * FROM bookmarks WHERE id = $1", [id]);

UNSAFE — never do this
  pool.query("SELECT * FROM bookmarks WHERE id = " + id);

  id = "1 OR 1=1"  ->  returns every row
  id = "1; DROP TABLE bookmarks; --"  ->  exactly what it looks like`},
    { label: "Try it on purpose", code:
`POST /bookmarks with a title of:

  '); DROP TABLE bookmarks; --

Then, in psql:
  SELECT * FROM bookmarks;
  \\dt

The table is still there, and one row contains that text as an
ordinary string. Because of $1, Postgres was handed the structure and
the value separately and never parsed the value as SQL.

Had the repository built the string by hand, the table would be gone.`}
  ]
},

{
  id: "connection-pooling",
  title: "The connection pool — why db.js exports one pool and every file imports it",
  category: "Databases",
  tags: ["postgres", "nodejs", "pg"],
  body: `
    <p>A Postgres connection is not cheap. On the server side <b>each one is a separate operating-system process</b> — tens of milliseconds to open and a few megabytes of memory to keep. That rules out both of the obvious approaches:</p>
    <ul>
      <li><b>One connection for the whole app.</b> A connection handles one query at a time, so every request queues behind every other one.</li>
      <li><b>A new connection per request.</b> You pay the setup cost on every single request, and 200 concurrent users means 200 processes on the database server.</li>
    </ul>
    <p>A <b>pool</b> is the middle path: keep a small set of connections open (<code>pg</code> defaults to 10) and lend them out. A query borrows one, runs, and hands it straight back. The setup cost is paid once at startup, and the database is protected from being swamped no matter how much traffic you get.</p>
    <p>This is the entire reason <code>db.js</code> exists as its own file and exports the pool <i>object</i> rather than a function that builds one. <b>One pool per application</b>, created once, imported everywhere. If each repository called <code>new Pool()</code>, ten repositories would mean ten pools and ten times the connections.</p>
  `,
  examples: [
    { label: "src/db.js — the whole file", code:
`const { Pool } = require("pg");
require("dotenv").config();

const pool = new Pool({
  connectionString: process.env.DATABASE_URL,
});

module.exports = pool;      // the object, not a factory`},
    { label: "The connection string", code:
`DATABASE_URL=postgresql://user:password@host:port/database

Locally, Homebrew creates a superuser named after your macOS user
with no password, so there is no password segment at all:

DATABASE_URL=postgresql://amanrathi@localhost:5432/bookmarks_dev

Check the username with:  whoami`},
    { label: "A health check that needs no tables", code:
`app.get("/health", async (req, res) => {
  try {
    const result = await pool.query("SELECT NOW()");
    res.json({ status: "ok", time: result.rows[0].now });
  } catch (err) {
    console.error("DB error:", err);
    res.status(500).json({ status: "error", message: "database unreachable" });
  }
});

SELECT NOW() just asks the server for the time, so it proves the
connection works without depending on any schema.`}
  ]
},

{
  id: "pg-result-object",
  title: "What pool.query() gives back — rows, rowCount, and getting the row you just wrote",
  category: "Databases",
  tags: ["postgres", "nodejs", "pg"],
  body: `
    <p><code>pool.query()</code> resolves to a result <i>object</i> with metadata, not to your data directly. Destructure the part you want:</p>
    <ul>
      <li><b><code>rows</code></b> — always an array, even when you queried by id and expect one thing. <code>const { rows } = await pool.query(...)</code>.</li>
      <li><b><code>rowCount</code></b> — how many rows were affected. The useful one for <code>DELETE</code> and <code>UPDATE</code>, where there's nothing to return but you still need to know whether anything matched.</li>
    </ul>
    <p><b><code>rows[0] ?? null</code></b> is the standard way to return a single record. <code>rows[0]</code> takes the first object; if nothing matched, the array is empty and that's <code>undefined</code>; <code>?? null</code> normalises it to a plain <code>null</code>. The repository returns <code>null</code> rather than throwing, because "not found" isn't an error at this layer — it's a fact, and it's the controller's job to decide that fact means 404.</p>
    <p><b><code>RETURNING *</code></b> is a Postgres feature worth knowing: after an <code>INSERT</code> or <code>UPDATE</code> it hands you back the resulting row, including the columns the database generated — <code>id</code> and <code>created_at</code>. Without it you'd need a second <code>SELECT</code> to find out what you just made.</p>
  `,
  highlight: `Without ORDER BY, SQL makes no promise whatsoever about the order rows come back in. It looks stable on a small table, then quietly stops being stable once the table grows or rows get updated. If order matters, say so in the query.`,
  examples: [
    { label: "The result object", code:
`{
  rows:     [ { id: 1, title: "...", created_at: 2026-09-05T... } ],
  rowCount: 1,
  fields:   [...],        // column names and type info
  command:  "SELECT"
}`},
    { label: "repositories/bookmarks.repository.js", code:
`const pool = require("../db");

async function findAll() {
  const { rows } = await pool.query(
    "SELECT * FROM bookmarks ORDER BY created_at DESC"
  );
  return rows;
}

async function findById(id) {
  const { rows } = await pool.query(
    "SELECT * FROM bookmarks WHERE id = $1",
    [id]
  );
  return rows[0] ?? null;              // undefined -> null
}

async function create({ title, url, notes }) {
  const { rows } = await pool.query(
    \`INSERT INTO bookmarks (title, url, notes)
     VALUES ($1, $2, $3)
     RETURNING *\`,                     // hands back id and created_at
    [title, url, notes ?? null]
  );
  return rows[0];
}

async function remove(id) {
  const { rowCount } = await pool.query(
    "DELETE FROM bookmarks WHERE id = $1",
    [id]
  );
  return rowCount > 0;                 // did anything actually match?
}`},
    { label: "COALESCE for partial updates", code:
`UPDATE bookmarks
   SET title = COALESCE($2, title),
       url   = COALESCE($3, url),
       notes = COALESCE($4, notes)
 WHERE id = $1
 RETURNING *

Pass only title and the other columns keep what they had, which is
what makes PATCH work.

The limitation: you can never deliberately set a column back to NULL,
because null already means "don't change this". Real apps build the
SET clause dynamically to get around it.`}
  ]
},

{
  id: "repository-layer",
  title: "The repository layer — the one rule is that each layer knows only about the layer below it",
  category: "Project Structure",
  tags: ["nodejs", "express", "structure", "postgres"],
  body: `
    <p>With a SQL database the layering gets one folder that the Mongoose version didn't have. Three layers, each answering a different question:</p>
    <ul>
      <li><b><code>routes/</code> — the "where".</b> URL and method to controller function. Pure wiring, no logic.</li>
      <li><b><code>controllers/</code> — the "what".</b> Web logic: read <code>req</code>, validate input, pick a status code, send <code>res</code>.</li>
      <li><b><code>repositories/</code> — the "how".</b> Every SQL query in the project, and nothing else.</li>
    </ul>
    <p><b>The rule that makes it work: each layer knows about the layer below it and nothing about the layer above.</b> The repository has no idea an HTTP request exists. The controller has no idea whether the data came from Postgres, Mongo, or a text file.</p>
    <p><b><code>repositories/</code> — the only files containing SQL.</b> No <code>req</code>, no <code>res</code>, no status codes. Functions take plain arguments (<code>findById(7)</code>) and return plain data (an object, or <code>null</code>), which means you could call them from a CLI script or a cron job just as easily. The payoff is that database concerns are quarantined: switching to Prisma later means rewriting this one file, and chasing a query bug means opening one file rather than grepping.</p>
    <p><b><code>controllers/</code> — the only files touching <code>req</code> and <code>res</code>.</b> "No title, so 400" and "repository returned null, so 404" are HTTP decisions and they belong here.</p>
    <p><b><code>routes/</code></b> — an Express <code>Router</code> is a mountable mini-app. Paths inside it are relative to wherever it gets mounted, so the file doesn't know it lives under <code>/bookmarks</code>. Move the mount to <code>/api/v2/bookmarks</code> and the routes file is untouched. It also puts your whole API surface on one screen.</p>
    <p><b>Is this overkill for five routes?</b> Honestly, yes — it would all fit in one 60-line file and behave identically. It's the shape most production Express codebases use, and the value only shows up at ten resources rather than one, when "where's the SQL for X?" has an obvious answer. Learning it on something small means the pattern is familiar before you actually need it. Some teams add a <code>services/</code> layer between controller and repository for logic spanning several tables; for pure CRUD it's an empty passthrough, so skip it until it isn't.</p>
  `,
  highlight: `Keeping every SQL string inside repositories/ is what makes the database swappable and the bugs findable. The moment a controller runs its own query, both of those stop being true — and it always starts with one "quick" query that didn't seem worth a repository function.`,
  examples: [
    { label: "The project", code:
`bookmarks-be/
├── .env                  # never committed
├── .gitignore
├── package.json
├── schema.sql
├── requests.http
└── src/
    ├── index.js          # app setup, runs once at startup
    ├── db.js             # the pool, created once
    ├── routes/bookmarks.routes.js
    ├── controllers/bookmarks.controller.js
    ├── repositories/bookmarks.repository.js
    └── middleware/errorHandler.js`},
    { label: "One request, top to bottom", code:
`POST /bookmarks   { "title": "x", "url": "y" }

index.js      express.json() parses the body into req.body
index.js      path starts with /bookmarks -> hand to the router
routes        POST + "/" -> controller.create
controller    title and url present, so call repo.create(req.body)

db.js         lends a connection, sends it, takes it back

If the repository throws, the controller's catch calls next(err) and
it jumps straight to errorHandler -> logged, 500 returned.`},
    { label: "routes/bookmarks.routes.js — wiring only", code:
`const express = require("express");

{
  id: "npm-scripts-bin",
  title: "npm scripts and node_modules/.bin — why nodemon works in a script but not in your shell",
  category: "Project Structure",
  tags: ["nodejs", "npm", "tooling"],
  body: `
    <p>A locally installed CLI tool drops an executable into <code>node_modules/.bin</code>. When npm runs a script it <b>temporarily prepends that folder to your PATH</b>, which is the whole reason <code>"dev": "nodemon src/index.js"</code> resolves without ever installing nodemon globally.</p>
    <p>Two consequences that look like bugs but aren't:</p>
    <ul>
      <li><code>sh: nodemon: command not found</code> from an npm script means it simply isn't in <code>node_modules</code> — <code>npm install --save-dev nodemon</code> fixes it.</li>
      <li>Typing <code>nodemon</code> straight at your shell prompt still fails even after the script works, because your normal shell never gets that PATH addition. That's expected, not broken.</li>
    </ul>
    <p>npm scripts also always run from the directory containing <code>package.json</code>, no matter where you were when you typed the command. That matters more than it sounds — it's why <code>npm run dev</code> finds your <code>.env</code> when running the file directly might not.</p>
    <p>Worth knowing: Node 22+ has a built-in file watcher, so <code>node --watch src/index.js</code> can replace nodemon entirely with no dependency at all.</p>
  `,
  examples: [
    { label: "Checking what's actually there", code:
`ls node_modules/.bin | grep nodemon

npm run dev        # works: .bin is on PATH for the script
nodemon src/index.js   # command not found: your shell has no .bin`},
    { label: "package.json", code:
`"scripts": {
  "dev": "nodemon src/index.js"
}

// or, with no dependency at all on Node 22+:
"scripts": {
  "dev": "node --watch src/index.js"
}`}
  ]
}

];

/* ==========================================================================
   RENDERING + SEARCH  (you normally don't need to touch anything below)
   ========================================================================== */

const $ = (s) => document.querySelector(s);
const notesEl = $("#notes"), tocEl = $("#toc"), chipsEl = $("#chips");
let query = "", activeCat = "all";

const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const strip = (html) => html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");

// Plain-text blob used for matching.
NOTES.forEach(n => {
  n._hay = [
    n.title, n.category, (n.tags || []).join(" "),
    strip(n.body || ""), n.highlight || "",
    (n.examples || []).map(e => (e.label || "") + " " + e.code).join(" ")
  ].join(" ").toLowerCase();
});

const terms = () => query.toLowerCase().split(/\s+/).filter(Boolean);
const matches = (n) => terms().every(t => n._hay.includes(t));

// Highlight search terms without breaking HTML tags.
function hl(html){
  const t = terms();
  if (!t.length) return html;
  const re = new RegExp("(" + t.map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return html.split(/(<[^>]+>)/g)
    .map(part => part.startsWith("<") ? part : part.replace(re, "<mark>$1</mark>"))
    .join("");
}

function noteHTML(n){
  const ex = (n.examples || []).map(e => `
    <div class="ex">
      ${e.label ? `<div class="ex-label">${hl(esc(e.label))}</div>` : ""}
      <pre>${hl(esc(e.code))}</pre>
    </div>`).join("");

  const tags = (n.tags || []).map(t =>
    `<button class="tag" data-tag="${esc(t)}">#${hl(esc(t))}</button>`).join("");

  return `
    <article id="${n.id}">
      <h3>${hl(n.title)} <a class="anchor" href="#${n.id}" title="Link to this note">#</a></h3>
      <div class="body">${hl(n.body)}</div>
      ${n.highlight ? `<div class="callout"><b>Worth remembering</b>${hl(n.highlight)}</div>` : ""}
      ${ex}
      ${tags ? `<div class="tags">${tags}</div>` : ""}
    </article>`;
}

function render(){
  const visible = NOTES.filter(n =>
    (activeCat === "all" || n.category === activeCat) && matches(n));

  // category chips (counts respect the search, not the active category)
  const cats = [...new Set(NOTES.map(n => n.category))];
  const searchHit = NOTES.filter(matches);
  chipsEl.innerHTML =
    `<button class="chip" data-cat="all" aria-pressed="${activeCat === "all"}">All <span class="n">${searchHit.length}</span></button>` +
    cats.map(c => {
      const count = searchHit.filter(n => n.category === c).length;
      return `<button class="chip" data-cat="${esc(c)}" aria-pressed="${activeCat === c}">${esc(c)} <span class="n">${count}</span></button>`;
    }).join("");

  if (!NOTES.length){
    notesEl.innerHTML = `<div class="empty">Nothing here yet — first note lands soon.</div>`;
    tocEl.innerHTML = "";
    chipsEl.innerHTML = "";
  } else if (!visible.length){
    notesEl.innerHTML = `<div class="empty">No notes match <code>${esc(query)}</code>.</div>`;
    tocEl.innerHTML = "";
  } else {
    let html = "", seen = null;
    for (const n of visible){
      if (n.category !== seen){ seen = n.category; html += `<h2 class="cat-head" id="cat-${n.category.replace(/\W+/g,"-").toLowerCase()}">${esc(seen)}</h2>`; }
      html += noteHTML(n);
    }
    notesEl.innerHTML = html;
    tocEl.innerHTML = visible.map(n => `<a href="#${n.id}">${esc(n.title.split("—")[0].trim())}</a>`).join("");
  }

  document.body.classList.toggle("no-notes", NOTES.length === 0);
  $("#meta").textContent = NOTES.length
    ? `${NOTES.length} note${NOTES.length === 1 ? "" : "s"}` + (query || activeCat !== "all" ? ` · showing ${visible.length}` : "")
    : "";
}

/* events */
$("#search").addEventListener("input", (e) => { query = e.target.value.trim(); render(); });

chipsEl.addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  activeCat = b.dataset.cat;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

notesEl.addEventListener("click", (e) => {
  const t = e.target.closest(".tag");
  if (!t) return;
  query = t.dataset.tag;
  activeCat = "all";
  $("#search").value = query;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.addEventListener("keydown", (e) => {
  const s = $("#search");
  if (e.key === "/" && document.activeElement !== s){ e.preventDefault(); s.focus(); s.select(); }
  if (e.key === "Escape" && document.activeElement === s){ s.value = ""; query = ""; render(); s.blur(); }
});

/* theme toggle: system → light → dark */
const root = document.documentElement;
const saved = localStorage.getItem("theme");
if (saved) root.setAttribute("data-theme", saved);
$("#theme").addEventListener("click", () => {
  const cur = root.getAttribute("data-theme");
  const next = cur === "light" ? "dark" : cur === "dark" ? null : "light";
  if (next){ root.setAttribute("data-theme", next); localStorage.setItem("theme", next); }
  else { root.removeAttribute("data-theme"); localStorage.removeItem("theme"); }
});

/* footer */
$("#footer").innerHTML =
  `My running notes on backend engineering. Written in plain language, updated as I learn. ` +
  `Press <code>/</code> to search. Last updated: ${new Date(document.lastModified).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}.`;

render();
if (location.hash){ const el = document.querySelector(location.hash); if (el) el.scrollIntoView(); }
</script>
</body>
</html>
